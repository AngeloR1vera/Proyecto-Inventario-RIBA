<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIBA - Movimientos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra-superior">
    <nav>
      <a href="productos.html">Productos</a>
      <a href="categorias.html">Categorías</a>
      <a href="movimientos.html">Movimientos</a>
    </nav>
    <div class="datos-sesion">
      <span id="textoUsuario"></span>
      <button id="botonSalir" type="button">Salir</button>
    </div>
  </header>

  <main class="contenido">
    <h1>Movimientos</h1>
    <p id="mensajeEstado"></p>

    <form id="formMovimiento">
      <h2>Nuevo movimiento</h2>

      <label for="productoMovimiento">Producto</label>
      <select id="productoMovimiento" required>
        <option value="">Selecciona un producto</option>
      </select>

      <label for="tipoMovimiento">Tipo</label>
      <select id="tipoMovimiento" required>
        <option value="ENTRADA">Entrada</option>
        <option value="SALIDA">Salida</option>
        <option value="AJUSTE">Ajuste</option>
      </select>

      <div id="contenedorSentido" hidden>
        <label for="sentidoAjuste">¿El ajuste aumenta o disminuye el inventario?</label>
        <select id="sentidoAjuste">
          <option value="INCREMENTO">Aumenta</option>
          <option value="DECREMENTO">Disminuye</option>
        </select>
      </div>

      <label for="cantidadMovimiento">Cantidad</label>
      <input type="number" id="cantidadMovimiento" min="0.001" step="any" required>

      <label for="notasMovimiento">Notas (opcional)</label>
      <input type="text" id="notasMovimiento">

      <button type="submit">Registrar movimiento</button>
      <p id="mensajeFormulario"></p>
    </form>

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Producto</th>
          <th>Tipo</th>
          <th>Cantidad</th>
          <th>Notas</th>
          <th>Registrado por</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
  </main>

  <script type="module" src="js/movimientos.js"></script>
</body>
</html>
